# TEMPORARY debug workflow (M2 fix loop) — diagnose anyhost SIGSEGV under
# box64 on ARM64 (run 37227195824: SOS_HOST_STARTED -> exit 139).
# Runs a scenario matrix against the host-linux-x64 artifact and ALWAYS
# succeeds (diagnostic only). Remove after root cause is fixed.

name: debug-m2

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of the build workflow that has the host-linux-x64 artifact"
        default: "37227195824"

permissions:
  contents: read
  actions: read

jobs:
  matrix:
    name: anyhost-under-box64 diagnostic matrix (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout box64 upstream (ptitSeb/box64 @ pinned SHA)
        uses: actions/checkout@v4
        with:
          repository: ptitSeb/box64
          ref: abfb8c3b2faddf2273d8ebe532c362d86bfa0356
          path: box64-src

      - name: Apply Android seccomp-safe patch to box64
        run: |
          set -e
          if ! grep -q "BOX64_ANDROID_SECCOMP_STUB" box64-src/src/emu/x64syscall.c; then
            git -C box64-src apply --whitespace=nowarn \
              "$GITHUB_WORKSPACE/patches/0001-android-seccomp-robust-list.patch"
          fi
          grep -q "BOX64_ANDROID_SECCOMP_STUB" box64-src/src/emu/x64syscall.c

      - name: Build box64 (ARM_DYNAREC=ON)
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build > /dev/null
          cmake -S box64-src -B box64-build -G Ninja -DARM_DYNAREC=ON \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build box64-build -j2
          ./box64-build/box64 --version || true

      - name: Download host-linux-x64 artifact (from build run)
        uses: actions/download-artifact@v4
        with:
          name: host-linux-x64
          path: host-x64
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Prepare scenarios
        run: |
          set -e
          chmod +x host-x64/anyhost host-x64/relinker
          mkdir -p ci-empty dbg
          echo "| scenario | env | exit | verdict |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

      # Each scenario: run, capture everything to its own log, never fail the job.
      - name: Scenario A — baseline (dynarec ON)
        if: always()
        run: |
          set +e
          timeout 60 env BOX64_LOG=INFO ./box64-build/box64 host-x64/anyhost --game-dir ci-empty > dbg/A.log 2>&1
          RC=$?
          echo "A: rc=$RC"; tail -n 12 dbg/A.log
          echo "| A baseline | BOX64_LOG=INFO | \`$RC\` | $([ $RC -eq 1 ] && echo OK || echo '**FAIL**') |" >> "$GITHUB_STEP_SUMMARY"

      - name: Scenario B — interpreter (BOX64_DYNAREC=0)
        if: always()
        run: |
          set +e
          timeout 120 env BOX64_DYNAREC=0 BOX64_LOG=INFO ./box64-build/box64 host-x64/anyhost --game-dir ci-empty > dbg/B.log 2>&1
          RC=$?
          echo "B: rc=$RC"; tail -n 12 dbg/B.log
          echo "| B interpreter | BOX64_DYNAREC=0 | \`$RC\` | $([ $RC -eq 1 ] && echo OK || echo '**FAIL**') |" >> "$GITHUB_STEP_SUMMARY"

      - name: Scenario C — dummy video (SDL_VIDEODRIVER=dummy, dynarec ON)
        if: always()
        run: |
          set +e
          timeout 60 env SDL_VIDEODRIVER=dummy BOX64_LOG=INFO ./box64-build/box64 host-x64/anyhost --game-dir ci-empty > dbg/C.log 2>&1
          RC=$?
          echo "C: rc=$RC"; tail -n 12 dbg/C.log
          echo "| C dummy video | SDL_VIDEODRIVER=dummy | \`$RC\` | $([ $RC -eq 1 ] && echo OK || echo '**FAIL**') |" >> "$GITHUB_STEP_SUMMARY"

      - name: Scenario D — interpreter + dummy
        if: always()
        run: |
          set +e
          timeout 120 env SDL_VIDEODRIVER=dummy BOX64_DYNAREC=0 BOX64_LOG=INFO ./box64-build/box64 host-x64/anyhost --game-dir ci-empty > dbg/D.log 2>&1
          RC=$?
          echo "D: rc=$RC"; tail -n 12 dbg/D.log
          echo "| D interp+dummy | both | \`$RC\` | $([ $RC -eq 1 ] && echo OK || echo '**FAIL**') |" >> "$GITHUB_STEP_SUMMARY"

      - name: Scenario E — --version only (isolates SDL_Init from static init)
        if: always()
        run: |
          set +e
          timeout 60 env BOX64_LOG=INFO ./box64-build/box64 host-x64/anyhost --version > dbg/E.log 2>&1
          RC=$?
          echo "E: rc=$RC"; cat dbg/E.log | tail -n 6
          echo "| E version | — | \`$RC\` | $([ $RC -eq 0 ] && echo OK || echo '**FAIL**') |" >> "$GITHUB_STEP_SUMMARY"

      - name: Scenario F — dynarec TRACE/DEBUG of baseline (root-cause evidence)
        if: always()
        run: |
          set +e
          timeout 90 env BOX64_LOG=DEBUG BOX64_DYNAREC=0 ./box64-build/box64 host-x64/anyhost --game-dir ci-empty > dbg/F-interp-debug.log 2>&1
          timeout 90 env BOX64_LOG=DEBUG ./box64-build/box64 host-x64/anyhost --game-dir ci-empty > dbg/F-dyn-debug.log 2>&1
          echo "### F: dynarec DEBUG tail (last 80 lines before death)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 dbg/F-dyn-debug.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### F: interpreter DEBUG tail (last 30 lines)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 30 dbg/F-interp-debug.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Scenario H — dynarec SAFEFLAGS=2
        if: always()
        run: |
          set +e
          timeout 60 env BOX64_DYNAREC_SAFEFLAGS=2 BOX64_LOG=INFO ./box64-build/box64 host-x64/anyhost --game-dir ci-empty > dbg/H.log 2>&1
          RC=$?
          echo "H: rc=$RC"; tail -n 4 dbg/H.log
          echo "| H SAFEFLAGS=2 | BOX64_DYNAREC_SAFEFLAGS=2 | \`$RC\` | $([ $RC -eq 1 ] && echo OK || echo '**FAIL**') |" >> "$GITHUB_STEP_SUMMARY"

      - name: Scenario I — dynarec BIGBLOCK=0
        if: always()
        run: |
          set +e
          timeout 60 env BOX64_DYNAREC_BIGBLOCK=0 BOX64_LOG=INFO ./box64-build/box64 host-x64/anyhost --game-dir ci-empty > dbg/I.log 2>&1
          RC=$?
          echo "I: rc=$RC"; tail -n 4 dbg/I.log
          echo "| I BIGBLOCK=0 | BOX64_DYNAREC_BIGBLOCK=0 | \`$RC\` | $([ $RC -eq 1 ] && echo OK || echo '**FAIL**') |" >> "$GITHUB_STEP_SUMMARY"

      - name: Scenario J — dynarec STRONGMEM=1
        if: always()
        run: |
          set +e
          timeout 60 env BOX64_DYNAREC_STRONGMEM=1 BOX64_LOG=INFO ./box64-build/box64 host-x64/anyhost --game-dir ci-empty > dbg/J.log 2>&1
          RC=$?
          echo "J: rc=$RC"; tail -n 4 dbg/J.log
          echo "| J STRONGMEM=1 | BOX64_DYNAREC_STRONGMEM=1 | \`$RC\` | $([ $RC -eq 1 ] && echo OK || echo '**FAIL**') |" >> "$GITHUB_STEP_SUMMARY"

      - name: Scenario K — dynarec conservative FPU (X87DOUBLE+noFASTNAN+noFASTROUND)
        if: always()
        run: |
          set +e
          timeout 60 env BOX64_DYNAREC_X87DOUBLE=1 BOX64_DYNAREC_FASTNAN=0 BOX64_DYNAREC_FASTROUND=0 BOX64_LOG=INFO ./box64-build/box64 host-x64/anyhost --game-dir ci-empty > dbg/K.log 2>&1
          RC=$?
          echo "K: rc=$RC"; tail -n 4 dbg/K.log
          echo "| K cons-FPU | X87DOUBLE=1 FASTNAN=0 FASTROUND=0 | \`$RC\` | $([ $RC -eq 1 ] && echo OK || echo '**FAIL**') |" >> "$GITHUB_STEP_SUMMARY"

      - name: Scenario G — relinker under box64 (usage smoke)
        if: always()
        run: |
          set +e
          timeout 60 ./box64-build/box64 host-x64/relinker > dbg/G.log 2>&1
          RC=$?
          echo "G: rc=$RC"; head -n 3 dbg/G.log
          echo "| G relinker usage | — | \`$RC\` | $([ $RC -ne 0 ] && echo OK || echo '**FAIL**') |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-m2-logs
          if-no-files-found: error
          path: dbg
